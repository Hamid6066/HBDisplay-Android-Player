name: Build HBDisplay APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore permanent signing keystore
        env:
          HBDISPLAY_KEYSTORE_BASE64: ${{ secrets.HBDISPLAY_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$HBDISPLAY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hbdisplay-release.jks"
          test -s "$RUNNER_TEMP/hbdisplay-release.jks"

      - name: Build signed release APK
        env:
          HBDISPLAY_KEYSTORE_FILE: ${{ runner.temp }}/hbdisplay-release.jks
          HBDISPLAY_KEYSTORE_PASSWORD: ${{ secrets.HBDISPLAY_KEYSTORE_PASSWORD }}
          HBDISPLAY_KEY_ALIAS: ${{ secrets.HBDISPLAY_KEY_ALIAS }}
          HBDISPLAY_KEY_PASSWORD: ${{ secrets.HBDISPLAY_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease --stacktrace

      - name: Verify release signing certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')
          echo "HBDisplay release certificate SHA-256: $CERT_SHA"
          test "$CERT_SHA" = "902F0A4CAB95EC6CF02AF83B58E2ECD8844D3C473A4DFCDEB93B92C4DECEC646"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HBDisplay-Player-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
