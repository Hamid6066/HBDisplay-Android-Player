plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.hbintellisys.player'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.hbintellisys.player'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0'

        buildConfigField 'String', 'DEFAULT_DISPLAY_URL', '"http://100.98.243.107:8094/"'
        buildConfigField 'String', 'DEFAULT_SITE_CODE', '"setareh"'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('HBDISPLAY_KEYSTORE_FILE') ?: 'hbdisplay-release.jks')
            storePassword System.getenv('HBDISPLAY_KEYSTORE_PASSWORD')
            keyAlias System.getenv('HBDISPLAY_KEY_ALIAS')
            keyPassword System.getenv('HBDISPLAY_KEY_PASSWORD')
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
